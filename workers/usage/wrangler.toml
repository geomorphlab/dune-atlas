# Dune Atlas usage counter: Cloudflare Worker settings (docs/guide/usage-counter.md).
# No secrets here: the API token and the CSV key are set with `npx wrangler secret put` and live only
# in Cloudflare. Replace the three REPLACE_WITH_... values before the first deploy (step 3 of the guide).
name = "dune-atlas-usage"
main = "src/index.ts"
compatibility_date = "2026-10-01"
# Cloudflare account id (not a secret): dashboard, Workers & Pages, Account Details
account_id = "107c452850a690ed588d9b00c4283aa8"
# no per-version preview addresses (only the one workers.dev address serves the counter)
preview_urls = false
# the free address https://dune-atlas-usage.<your-subdomain>.workers.dev
workers_dev = true
# the counter's own address on the lab domain (Cloudflare creates the DNS record on deploy); the plain
# name and path (/v1/n) are not on content blockers' lists, unlike *.workers.dev/event
routes = [{ pattern = "api.geomorphlab.org", custom_domain = true }]
# Invocation logs off: they would record details of each request (such as the visitor's IP address).
# The outcome of the daily collection is in status.csv instead.
[observability]
enabled = false

# once a day at 03:17 UTC: collects the previous three days of Cloudflare's figures
[triggers]
crons = ["17 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "dune-atlas-usage"
# printed by `npx wrangler d1 create dune-atlas-usage`
database_id = "f6c8ab27-f28b-4b2a-b2b9-3c88672711ef"
migrations_dir = "migrations"

[vars]
# same value as account_id above
CF_ACCOUNT_ID = "107c452850a690ed588d9b00c4283aa8"
# zone id of geomorphlab.org: dashboard, the domain's Overview page, API section
CF_ZONE_ID = "43a1a6c9db7a36858003336278872422"
DATA_HOST = "data.geomorphlab.org"
SITE_HOST = "map.geomorphlab.org"
# optional: Web Analytics site tag (32 characters). Empty: the site is picked by its host name (SITE_HOST).
WEB_ANALYTICS_SITE_TAG = ""
# downloads are accepted only from these pages; the preview origin is counted separately as "preview"
ALLOWED_ORIGINS = "https://map.geomorphlab.org"
PREVIEW_ORIGINS = "http://127.0.0.1:5173"
