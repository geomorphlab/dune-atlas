<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MGL - Dune Atlas</title>
    <!-- atlas icon (random-point Voronoi in the map colours with the lab's barchan; public/favicon.svg, docs/guide/icon.md);
         %BASE_URL% = the build's base (/ for Earth, /mars/ for Mars); ?v=2: browsers cache tab icons by address, so a
         changed icon needs a new one (raise it with every new icon) -->
    <link rel="icon" href="%BASE_URL%favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png?v=2" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png?v=2" />
    <meta name="description" content="Interactive explorer for aeolian geomorphology on Earth and Mars. Developed by the Monash Geomorphology Lab." />
    <!-- link preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Monash Geomorphology Lab" />
    <meta property="og:title" content="Dune Atlas · Earth &amp; Mars" />
    <meta property="og:description" content="Interactive explorer for aeolian geomorphology on Earth and Mars. Developed by the Monash Geomorphology Lab." />
    <meta property="og:url" content="https://map.geomorphlab.org/" />
    <meta property="og:image" content="https://map.geomorphlab.org/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Dune Atlas globe of Africa and Europe with sand-flux streamlines over drift potential" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- /link preview -->
  </head>
  <body>
    <a class="skip-link" href="#layer-panel">Skip to layer controls</a>
    <div id="app">
      <main id="map" aria-label="Map"></main>
      <aside id="layer-panel" aria-label="Layers and settings"></aside>
      <aside id="cell-panel" aria-label="Selected cell" aria-live="polite" hidden></aside>
    </div>
    <noscript>The Dune Atlas needs JavaScript and WebGL.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
