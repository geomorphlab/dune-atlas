# GENERATED by `python -m dune_atlas_pipeline.mars.sidecars` (qsdiv: RDP/RDD divergence with R_MARS;
# rho_mean: mcd-v61-clim annual mean). Do not edit by hand. Fragment {groups, layers}; layer objects
# validate against registry/layers.schema.json $defs/layer. Sources are dataset-relative ('{dataset}' =
# dune-atlas/mars/v2/datasets/mcd-v61-clim); clim in display units (after display.transform), fluxes in m²/yr,
# from p2/p98 at d = 200 µm over all cells (Mars has no land mask).
# qsdiv clim: ± p98 of |qsdiv| over dune cells (cover > 1 %) at d = 200 µm, m/kyr; rho_mean clim:
# p2/p98 over all cells.
groups: []
layers:
- id: qsdiv
  title: Saturated flux divergence (∇·qs)
  titleTex: Saturated flux divergence $\nabla\cdot\vec{q}_s$
  group: drift
  type: zarr-field
  source: '{dataset}/fields/qsdiv.zarr'
  variable: qsdiv
  thresholdAware: true
  units: m/kyr
  description: 'Divergence of the time-averaged saturated sand-flux vector (magnitude RDP, direction RDD) on the
    Mars sphere, following Gunn (2026), Methods M6: $\nabla\cdot\vec{q}_s = \frac{1}{R\cos\phi}\left[\frac{\partial
    (q\cos\theta)}{\partial\lambda} + \frac{\partial (q\sin\theta\cos\phi)}{\partial\phi}\right]$ with $q = RDP$,
    $\theta = RDD$. By conservation of sand mass, negative values (flux convergence) imply deposition and positive
    values (flux divergence) erosion. The values assume a saturated flux and an unlimited supply of loose sand,
    so on rock or crusted surfaces actual erosion is limited by the sand available.'
  citation: 'Gunn, A. (2026). The distribution of Earth''s wind-blown sand dunes. Nature Communications. doi:10.1038/s41467-026-75466-y;
    transport law: Pähtz, T. & Durán, O. (2023). Scaling laws for planetary sediment transport from DEM-RANS numerical
    simulations. Journal of Fluid Mechanics 963, A20. doi:10.1017/jfm.2023.343; winds: Mars Climate Database 6.1
    climatology (average solar EUV), mean-state lowest-level winds every two Mars hours through one MCD year (Forget,
    F. et al. (1999). J. Geophys. Res. 104(E10), 24155-24175. doi:10.1029/1999JE001025; Millour, E. et al. (2018).
    The Mars Climate Database (version 5.3). From Mars Express to ExoMars workshop, ESAC, Madrid; https://www-mars.lmd.jussieu.fr/)'
  attribution:
    citation: 'Gunn, A. (2026). The distribution of Earth''s wind-blown sand dunes. Nature Communications. doi:10.1038/s41467-026-75466-y;
      transport law: Pähtz, T. & Durán, O. (2023). Scaling laws for planetary sediment transport from DEM-RANS numerical
      simulations. Journal of Fluid Mechanics 963, A20. doi:10.1017/jfm.2023.343; winds: Mars Climate Database 6.1
      climatology (average solar EUV), mean-state lowest-level winds every two Mars hours through one MCD year (Forget,
      F. et al. (1999). J. Geophys. Res. 104(E10), 24155-24175. doi:10.1029/1999JE001025; Millour, E. et al. (2018).
      The Mars Climate Database (version 5.3). From Mars Express to ExoMars workshop, ESAC, Madrid; https://www-mars.lmd.jussieu.fr/)'
    licence: 'Mars Climate Database: free scientific use with citation; no commercial use without authorisation
      (LMD); no warranty'
  visible: false
  opacity: 0.85
  queryable: false
  display:
    transform: scale
    scale: 1000.0
    colormap: piyg
    clim:
    - -0.012
    - 0.012
- id: rho_mean
  title: Near-surface air density
  titleTex: Near-surface air density $\overline{\rho_f}$
  group: environment
  type: zarr-field
  source: '{dataset}/fields/rho_mean.zarr'
  variable: rho_mean
  thresholdAware: false
  units: kg/m³
  description: Mean over the samples of the Mars year of the lowest-layer air density $\rho_f = p/(R T)$ of the
    wind dataset (one sample every two Mars hours; $p$ = mid pressure of the lowest layer, $T$ = lowest-level temperature).
  citation: Mars Climate Database version 6.1, climatology scenario with average solar EUV (Forget, F. et al. (1999).
    J. Geophys. Res. 104(E10), 24155-24175. doi:10.1029/1999JE001025; Millour, E. et al. (2018). The Mars Climate
    Database (version 5.3). From Mars Express to ExoMars workshop, ESAC, Madrid; https://www-mars.lmd.jussieu.fr/)
  attribution:
    citation: Mars Climate Database version 6.1, climatology scenario with average solar EUV (Forget, F. et al.
      (1999). J. Geophys. Res. 104(E10), 24155-24175. doi:10.1029/1999JE001025; Millour, E. et al. (2018). The Mars
