      text: 'Greybush, S. J., Kalnay, E., Wilson, R. J., Hoffman, R. N., Nehrkorn, T., Leidner, M., et al.
        (2019). The Ensemble Mars Atmosphere Reanalysis System (EMARS) Version 1.0. Geoscience Data Journal
        6(2), 137–150.'
      doi: '10.1002/gdj3.77'
    - label: Data
      text: 'Greybush, S. J., Kalnay, E., Wilson, R. J., Hoffman, R. N., Nehrkorn, T., Leidner, M., et al.
        (2018). The Ensemble Mars Atmosphere Reanalysis System (EMARS) Version 1.0 Dataset. Penn State Data
        Commons.'
