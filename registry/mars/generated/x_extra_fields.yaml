# GENERATED by `python -m dune_atlas_pipeline.mars.sidecars` (qsdiv: RDP/RDD divergence with R_MARS;
# rho_mean: FV3 annual mean). Do not edit by hand. Fragment {groups, layers}; layer objects
# validate against registry/layers.schema.json $defs/layer. Sources are dataset-relative ('{dataset}' =
# dune-atlas/mars/v2/datasets/fv3-beta1); clim in display units (after display.transform), fluxes in m²/yr,
# from p2/p98 at d = 200 µm over all cells (Mars has no land mask).
# qsdiv clim: ± p98 of |qsdiv| over dune cells (cover > 1 %) at d = 200 µm, m/kyr; rho_mean clim:
# p2/p98 over all cells.
groups: []
layers:
- id: qsdiv
  title: Saturated flux divergence (∇·qs)
  titleTex: Saturated flux divergence $\nabla\cdot\vec{q}_s$
  group: drift
  type: zarr-field
  source: '{dataset}/fields/qsdiv.zarr'
  variable: qsdiv
  thresholdAware: true
  units: m/kyr
  description: 'Divergence of the time-averaged saturated sand-flux vector (magnitude RDP, direction RDD) on the
    Mars sphere, following Gunn (2026), Methods M6: $\nabla\cdot\vec{q}_s = \frac{1}{R\cos\phi}\left[\frac{\partial
    (q\cos\theta)}{\partial\lambda} + \frac{\partial (q\sin\theta\cos\phi)}{\partial\phi}\right]$ with $q = RDP$,
    $\theta = RDD$. By conservation of sand mass, negative values (flux convergence) imply deposition and positive
    values (flux divergence) erosion. The values assume a saturated flux and an unlimited supply of loose sand,
    so on rock, crusted or vegetated surfaces actual erosion is limited by the sand available.'
  citation: 'Gunn, A. (2026). The distribution of Earth''s wind-blown sand dunes. Nature Communications. doi:10.1038/s41467-026-75466-y;
    transport law: Pähtz, T. & Durán, O. (2023). Scaling laws for planetary sediment transport from DEM-RANS numerical
    simulations. Journal of Fluid Mechanics 963, A20. doi:10.1017/jfm.2023.343; winds: MCMC FV3-based Mars GCM Beta
    Output Release 1, one Mars year of hourly lowest-level winds (NASA Ames Mars Climate Modeling Center (2023),
    doi:10.25966/rjgg-r639, https://data.nas.nasa.gov/legacygcm/fv3betaout1/fv3betaout1/; model physics: Haberle,
    R. M. et al. (2019). Icarus 333, 130–164. doi:10.1016/j.icarus.2019.03.026)'
  attribution:
    citation: 'Gunn, A. (2026). The distribution of Earth''s wind-blown sand dunes. Nature Communications. doi:10.1038/s41467-026-75466-y;
      transport law: Pähtz, T. & Durán, O. (2023). Scaling laws for planetary sediment transport from DEM-RANS numerical
      simulations. Journal of Fluid Mechanics 963, A20. doi:10.1017/jfm.2023.343; winds: MCMC FV3-based Mars GCM
      Beta Output Release 1, one Mars year of hourly lowest-level winds (NASA Ames Mars Climate Modeling Center
      (2023), doi:10.25966/rjgg-r639, https://data.nas.nasa.gov/legacygcm/fv3betaout1/fv3betaout1/; model physics:
      Haberle, R. M. et al. (2019). Icarus 333, 130–164. doi:10.1016/j.icarus.2019.03.026)'
    licence: NASA Ames MCMC output; no licence stated (NASA open data)
  visible: false
  opacity: 0.85
  queryable: false
  display:
