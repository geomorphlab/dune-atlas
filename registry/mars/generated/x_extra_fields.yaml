# GENERATED by `python -m dune_atlas_pipeline.mars.sidecars` (Wind track) (qsdiv: RDP/RDD divergence with R_MARS;
# rho_mean: FV3 annual mean). Do not edit by hand. Fragment {groups, layers}; layer objects
# validate against registry/layers.schema.json $defs/layer. Sources are dataset-relative ('{dataset}' =
# dune-atlas/mars/v1/datasets/fv3-beta1); clim in display units (after display.transform), fluxes in m²/yr,
# from p2/p98 at d = 200 µm over all cells (Mars has no land mask).
# qsdiv clim: ± p98 of |qsdiv| over dune cells (cover > 1 %) at d = 200 µm, m/kyr; rho_mean clim:
# p2/p98 over all cells.
groups: []
layers:
- id: qsdiv
  title: Saturated flux divergence (∇·qs)
  titleTex: $\nabla\cdot\vec{q}_s$
  group: drift
  type: zarr-field
  source: '{dataset}/fields/qsdiv.zarr'
  variable: qsdiv
  thresholdAware: true
  units: m/kyr
  description: Divergence of the time-averaged saturated sand-flux vector (magnitude RDP, direction RDD) on the
    Mars sphere (R = 3389.5 km), following Gunn (2026), Methods M6. Negative values (flux convergence) imply deposition,
    positive values (flux divergence) erosion.
  citation: 'Gunn, A. (2026). The distribution of Earth''s wind-blown sand dunes. Nature Communications. doi:10.1038/s41467-026-75466-y;
    transport law: Pähtz, T. & Durán, O. (2023). Scaling laws for planetary sediment transport from DEM-RANS numerical
    simulations. Journal of Fluid Mechanics 963, A20. doi:10.1017/jfm.2023.343; winds: MCMC FV3-based Mars GCM Beta
    Output Release 1, one Mars year of hourly lowest-level winds (NASA Ames Mars Climate Modeling Center (2023),
    https://data.nas.nasa.gov/legacygcm/fv3betaout1/fv3betaout1/; model physics: Haberle, R. M. et al. (2019). Icarus
    333, 130–164. doi:10.1016/j.icarus.2019.03.026)'
  attribution:
    citation: 'Gunn, A. (2026). The distribution of Earth''s wind-blown sand dunes. Nature Communications. doi:10.1038/s41467-026-75466-y;
      transport law: Pähtz, T. & Durán, O. (2023). Scaling laws for planetary sediment transport from DEM-RANS numerical
      simulations. Journal of Fluid Mechanics 963, A20. doi:10.1017/jfm.2023.343; winds: MCMC FV3-based Mars GCM
      Beta Output Release 1, one Mars year of hourly lowest-level winds (NASA Ames Mars Climate Modeling Center
      (2023), https://data.nas.nasa.gov/legacygcm/fv3betaout1/fv3betaout1/; model physics: Haberle, R. M. et al.
      (2019). Icarus 333, 130–164. doi:10.1016/j.icarus.2019.03.026)'
    licence: NASA Ames MCMC output; no licence stated (NASA open data)
  visible: false
  opacity: 0.85
  queryable: false
  display:
    transform: scale
    scale: 1000.0
    colormap: piyg
    clim:
    - -0.032
    - 0.032
- id: rho_mean
  title: Near-surface air density
  titleTex: Near-surface air density $\overline{\rho_f}$
  group: environment
  type: zarr-field
  source: '{dataset}/fields/rho_mean.zarr'
  variable: rho_mean
  thresholdAware: false
  units: kg/m³
  description: Mean over the Mars year of the hourly lowest-layer air density $\rho_f = p/(R T)$ of the FV3 GCM
    ($p$ = mid pressure of the lowest layer, $T$ = lowest-level temperature).
  citation: 'NASA Ames Mars Climate Modeling Center (2023). MCMC FV3-based Mars GCM Beta Output Release 1. https://data.nas.nasa.gov/legacygcm/fv3betaout1/fv3betaout1/;
    model physics: Haberle, R. M. et al. (2019). Icarus 333, 130–164. doi:10.1016/j.icarus.2019.03.026'
  attribution:
    citation: 'NASA Ames Mars Climate Modeling Center (2023). MCMC FV3-based Mars GCM Beta Output Release 1. https://data.nas.nasa.gov/legacygcm/fv3betaout1/fv3betaout1/;
      model physics: Haberle, R. M. et al. (2019). Icarus 333, 130–164. doi:10.1016/j.icarus.2019.03.026'
    licence: NASA Ames MCMC output; no licence stated (NASA open data)
  visible: false
  opacity: 0.85
  queryable: true
  display:
    transform: none
    colormap: viridis
    clim:
    - 0.0098
    - 0.026
