# Named places of the search box (schema: registry/places.schema.json). Each entry:
#   id, line1 (Latin-script name), optional line2 {text, lang} (non-Latin name and its language),
#   type (feature type), aliases, lat, lon, radius_km, dune_km2, countries, sources
# Mars: IAU-approved feature names of the Gazetteer of Planetary Nomenclature (IAU WGPSN / USGS Astrogeology)
# whose official-diameter circle contains at least 10 km² of mapped dunes (MGD3 and Fenton 2020, merged), with
# a few informal names as aliases. Craters: line1 = IAU name + "crater". lat: planetocentric; lon: east-positive
# -180..180° (the atlas convention; the Gazetteer's 0–360° E centre converted). radius_km: half the official
# diameter, limited to 25–600 km (the zoom); dune_km2: mapped dune area inside the official-diameter circle
# (ranks results that match equally well). Generated from mars-dune-features-draft.csv; centres and feature
# pages checked against the Gazetteer's MARS_nomenclature_center_pts (downloaded in October 2026).
enabled: true
credit: "Feature names: Gazetteer of Planetary Nomenclature (IAU Working Group for Planetary System Nomenclature; USGS Astrogeology), https://planetarynames.wr.usgs.gov/."
# note: the naming note (verbatim, approved October 2026), note_links: the text that is a link
note: "Dune-field names are IAU-approved feature names from the Gazetteer of Planetary Nomenclature (IAU/USGS), with a few informal aliases."
note_links: [{"text": "Gazetteer of Planetary Nomenclature", "href": "https://planetarynames.wr.usgs.gov/"}]
