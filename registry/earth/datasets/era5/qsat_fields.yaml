- id: sige_sigh
  title: Stability of elongating dunes on starved beds (σE/σH)
  titleTex: Stability of elongating dunes on starved beds $\sigma_E/\sigma_H$
  group: morphology
  type: zarr-field
  source: '{dataset}/fields/sige_sigh.zarr'
  variable: sige_sigh
  thresholdAware: true
  units: dimensionless
  description: 'Ratio of the growth rates in height of dunes in the elongation and bed-instability orientations,
    $\langle|Q_{\bot}(\alpha_E)|\rangle/\langle|Q_{\bot}(\alpha_H)|\rangle$, between 0 and 1. It assesses whether
    dunes elongating from a sand source on a starved bed are stable: in numerical simulations and in dunes around
    the Tibesti Massif, elongating linear dunes form where the ratio is above about 0.6 and trains of barchans form
    below it (Gao et al. 2015; Courrech du Pont et al. 2024). It does not take bed mobility or other boundary conditions
    into account.'
