- id: qhne_ac_nl
  title: Morphology of elongating dunes (Q̂|⊥|/∥,E)
  titleTex: Morphology of elongating dunes $\hat{Q}_{|\bot|/\parallel,E}$
  group: morphology
  type: zarr-field
  source: '{dataset}/fields/qhne_ac_nl.zarr'
  variable: qhne_ac_nl
  thresholdAware: true
  units: dimensionless
  description: 'Gross across-crest over net along-crest sand flux for dunes in the elongation orientation, $\langle
    |Q_{\bot}(\alpha_E)|\rangle/\langle Q_{\parallel}(\alpha_E)\rangle$: the balance between growth in height and
    elongation. For dunes that elongate without migrating, it is the parameter expected to distinguish their shapes.
    Compared with $\hat{Q}_{|\bot|/\bot,H}$, it indicates whether elongation or migration is more likely to set
    dune shape and orientation on a starved bed: the dynamic with the larger ratio favours growth in height more
    and is expected to prevail (Courrech du Pont et al. 2024). The ratio goes to infinity where its denominator
    (a net flux) goes to zero (shown clipped to ±60,000).'
