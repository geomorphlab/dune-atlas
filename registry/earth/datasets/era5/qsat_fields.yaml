- id: qhab_ac_nc
  title: Growth-in-height vs migration balance (Q̂|⊥|/⊥,H)
  titleTex: Growth-in-height vs migration balance $\hat{Q}_{|\bot|/\bot,H}$
  group: morphology
  type: zarr-field
  source: '{dataset}/fields/qhab_ac_nc.zarr'
  variable: qhab_ac_nc
  thresholdAware: true
  units: dimensionless
  description: 'Gross over net across-crest sand flux for crests of the bed-instability orientation, $|\langle |Q_{\bot}(\alpha_H)|\rangle/\langle
    Q_{\bot}(\alpha_H)\rangle|$, never below 1: the balance between growth in height and migration. Values near
    1 mean that transport across the crest goes one way and the dunes mainly migrate; large values mean that it
    reverses, building the dunes up with little net migration, which may also favour straighter crests (Courrech
    du Pont et al. 2024). In the sand-covered-bed examples of Courrech du Pont et al. (2024) it is about 1.1 for
    transverse, 5 for oblique and 49 for longitudinal dunes. The ratio goes to infinity where its denominator (a
    net flux) goes to zero (shown clipped to ±60,000).'
  citation: 'Gunn, A. (2026). The distribution of Earth''s wind-blown sand dunes. Nature Communications. doi:10.1038/s41467-026-75466-y;
