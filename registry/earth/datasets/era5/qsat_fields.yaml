  variable: dpm
  thresholdAware: true
  units: m²/yr
  description: 'Time-averaged flat-bed saturated sand flux, $DP = \sum n q / \sum n$ over all speed and direction
    bins: the volume of packed sand per metre width that the wind could move per year over a flat bed fully covered
    by loose sand (Gunn 2026). Like the drift potential of Fryberger & Dean (1979) it measures the wind''s capacity
    to transport sand, but it is a different quantity: Fryberger''s DP is in vector units, computed from 10 m wind
    speeds in knots as $V^2(V - V_t)$ with a 12-knot threshold, whereas this DP is a physical flux computed from
    the friction velocity with the threshold set by the slider. The ratio of the two depends on the wind-speed distribution,
    and Fryberger''s energy classes (below 200, 200–400 and above 400 vector units) are in vector units.'
