- id: qhab_nl_nc
  title: Crest straightness vs sinuosity, bed-instability mode (Q̂∥/⊥,H)
  titleTex: Crest straightness vs sinuosity, bed-instability mode $\hat{Q}_{\parallel/\bot,H}$
  group: morphology
  type: zarr-field
  source: '{dataset}/fields/qhab_nl_nc.zarr'
  variable: qhab_nl_nc
  thresholdAware: true
  units: dimensionless
  description: Net along-crest over net across-crest sand flux for crests of the bed-instability orientation, $|\langle
    Q_{\parallel}(\alpha_H)\rangle/\langle Q_{\bot}(\alpha_H)\rangle|$. Along-crest transport tends to keep crests
    straight, while across-crest transport, which drives migration, tends to make them sinuous (Rubin 2012), so
    higher values suggest straighter long-crested dunes on sand-covered beds. For dunes migrating on starved beds,
    the ratio measures how far the migration direction departs from the direction of the sand flux on the dune,
    which makes dunes such as barchans asymmetric (Courrech du Pont et al. 2024). In the sand-covered-bed examples
    of Courrech du Pont et al. (2024) it is about 0.03 for transverse, 0.4 for oblique and 22 for longitudinal dunes.
    The ratio goes to infinity where its denominator (a net flux) goes to zero (shown clipped to ±60,000).
  citation: 'Gunn, A. (2026). The distribution of Earth''s wind-blown sand dunes. Nature Communications. doi:10.1038/s41467-026-75466-y;
    winds: ERA5 hourly 10 m winds 1950–2024 (Hersbach, H. et al. (2020). The ERA5 global reanalysis. Quarterly Journal
    of the Royal Meteorological Society 146, 1999–2049. doi:10.1002/qj.3803; data: Hersbach, H. et al. (2023). ERA5
    hourly data on single levels from 1940 to present. Copernicus Climate Change Service (C3S) Climate Data Store
