layers:
- id: vegetation
  title: Total vegetation cover
  titleTex: Total vegetation cover $V$
  group: climate
  type: zarr-field
  source: dune-atlas/v1/fields/vegetation.zarr
  variable: vegetation
  thresholdAware: false
  units: '%'
  description: Mean total vegetation cover (green plus dry vegetation, including trees; % of the ground), 2001–2025,
