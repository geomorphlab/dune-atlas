    data. Remote Sensing of Environment 161, 12-26. doi:10.1016/j.rse.2015.01.021; Guerschman, J.P. & Hill, M.J.
    (2018) Calibration and validation of the Australian fractional cover product for MODIS collection 6. Remote
    Sensing Letters 9, 696-705. doi:10.1080/2150704X.2018.1465611; data: Guerschman, J. (2014) Fractional cover
    - MODIS, CSIRO algorithm. CSIRO. doi:10.4225/08/5848a3f19a7b3 (CC BY 4.0, © 2008–2019 CSIRO). GEOGLAM RAPP Map:
    https://map.geo-rapp.org/'
  attribution:
    source: 'Fractional cover - MODIS, CSIRO Land and Water algorithm, Version 3.1.0 (CSIRO; MODIS MCD43A4 collection
      6/6.1, monthly medoid, 500 m): total vegetation cover (photosynthetic + non-photosynthetic vegetation), 2001–2025;
      the vegetation product of GEOGLAM Rangeland and Pasture Productivity (RAPP), hosted by NCI'
    citation: 'Guerschman, J.P. et al. (2015) Assessing the effects of site heterogeneity and soil properties when
      unmixing photosynthetic vegetation, non-photosynthetic vegetation and bare soil fractions from Landsat and
      MODIS data. Remote Sensing of Environment 161, 12-26. doi:10.1016/j.rse.2015.01.021; Guerschman, J.P. & Hill,
      M.J. (2018) Calibration and validation of the Australian fractional cover product for MODIS collection 6.
      Remote Sensing Letters 9, 696-705. doi:10.1080/2150704X.2018.1465611; data: Guerschman, J. (2014) Fractional
      cover - MODIS, CSIRO algorithm. CSIRO. doi:10.4225/08/5848a3f19a7b3'
    doi: 10.4225/08/5848a3f19a7b3
    licence: CC BY 4.0, © 2008–2019 CSIRO
    url: https://map.geo-rapp.org/
    changes: 'Processed for the atlas: monthly 500 m tiles averaged to 0.1° and over 2001–2025 (valid tot_cov ≤
      103 %; months without valid data skipped); coarser zoom levels are means of the valid 0.1° cells; values rounded
      to a relative precision of 1.2e-4 for compression.'
  visible: false
  opacity: 0.85
  queryable: false
  display:
