    - 100.0
    log: false
    ticks:
    - 0
    - 20
    - 40
    - 60
    - 80
    - 100
    topLabel: ≥ 100
    legendNote: Mean of monthly MODIS fractional cover 2001–2025 (photosynthetic + non-photosynthetic vegetation).
      [Explore the full time series at GEOGLAM RAPP](https://map.geo-rapp.org/). No data over ocean, Antarctica
      and north of 70° N.
