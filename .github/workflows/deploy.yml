name: build-and-deploy
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm run validate-registry
      - run: npm run validate-registry:mars
      - run: npm test
      # Mars tests: the local-store test skips without staging/ (not in git); the drift guard hashes the
      # checked-out files (works in the shallow checkout; skipped without git)
      - run: npm run test:mars
      - run: npm run build
        env: { VITE_DATA_BASE: "https://data.geomorphlab.org" }
      # Mars atlas: same UI, VITE_BODY=mars, served at /mars/ of the same Pages site
      - run: npm run build:mars
        env: { VITE_BODY: mars, VITE_BASE: /mars/, VITE_DATA_BASE: "https://data.geomorphlab.org", VITE_SITE_URL: "https://map.geomorphlab.org/mars/" }
      - run: rm -rf dist/mars && cp -R dist-mars dist/mars
      - uses: actions/upload-pages-artifact@v3
        with: { path: app/dist }
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/deploy-pages@v4
